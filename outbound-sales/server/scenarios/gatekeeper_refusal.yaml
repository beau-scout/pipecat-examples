# Refusal: the front office is not interested and asks to be removed from the
# list. Hailey must apologize once, never argue, and end the call with reason
# "refused".
name: gatekeeper_refusal

judge:
  modality: text
  eval:
    service: openai
    model: gpt-4o-mini

turns:
  - user: "Riverside High School, how can I help you?"
    expect:
      - event: response
        eval: "says she is calling from RunScout and asks who is in charge of safety or security"

  - user: "We don't take vendor calls. Please take us off your list."
    expect:
      - event: response
        eval: "apologizes once, does not argue or push back, thanks them, and says goodbye"
      - event: function_call
        calls:
          - name: end_call
            args: { reason: refused }
