# Happy path: the front office answers and hands over the security director's
# contact info. Hailey reads the email back to confirm, saves it (with the
# phone extension), says thanks, and hangs up.
name: happy_path

judge:
  modality: text
  eval:
    service: openai
    model: gpt-4o-mini

turns:
  # On a phone call the callee speaks first; Hailey then continues.
  - user: "Good morning, Lincoln Elementary, front office."
    expect:
      - event: response
        eval: "asks who is in charge of safety or security at the school or district"

  - user: "Why are you calling? What is this about?"
    expect:
      - event: response
        eval: "briefly explains RunScout connects to existing camera systems to detect everyday safety incidents like student elopement or propped-open doors, and returns to asking who handles security"

  - user: "Oh, that'd be our safety director, Dana Smith. Her email is dana.smith@lincoln.k12.ca.us, and her direct line is 555-0142 extension 12."
    expect:
      # Hailey reads the email back to confirm before saving.
      - event: response
        eval: "reads the email address back to confirm it is spelled correctly"

  - user: "Yes, that's correct."
    expect:
      # Expectations match in order: Hailey saves the contact (with extension),
      # speaks her thanks, then hangs up.
      - event: function_call
        calls:
          - name: save_contact_info
      - event: response
        eval: "thanks them"
      - event: function_call
        calls:
          - name: end_call
            args: { reason: contact_captured }
