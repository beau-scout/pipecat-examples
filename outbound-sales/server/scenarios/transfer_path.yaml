# Transfer path: the front office transfers Hailey to the district's safety
# director. Hailey re-introduces herself, gets the director's direct email and
# phone, saves it, and ends the call.
name: transfer_path

judge:
  modality: text
  eval:
    service: openai
    model: gpt-4o-mini

turns:
  - user: "Maple Grove Unified School District, front desk."
    expect:
      - event: response
        eval: "says she is calling from RunScout and asks who is in charge of safety or security at the school or district"

  - user: "What's this regarding?"
    expect:
      - event: response
        eval: "briefly explains RunScout detects everyday safety incidents like student elopement or propped-open doors using existing cameras, and asks who handles security"

  - user: "That would be our director of safety. Hold on, I'll transfer you."
    expect:
      - event: response
        eval: "thanks them and waits for the transfer; does not say goodbye or end the call"

  - user: "Hi, this is Dana Smith, director of safety and security. Who am I speaking with?"
    expect:
      - event: response
        eval: "introduces herself again as calling from RunScout and explains why she is calling"

  - user: "Sure, email me at dana.smith@maplegrove.k12.ca.us and my direct line is 555-0148."
    expect:
      # Hailey reads the email back to confirm before saving.
      - event: response
        eval: "reads the email address back to confirm it is spelled correctly"

  - user: "That's right."
    expect:
      # Expectations match in order: Hailey saves the contact, speaks her
      # thanks, then hangs up.
      - event: function_call
        calls:
          - name: save_contact_info
      - event: response
        eval: "thanks Dana"
      - event: function_call
        calls:
          - name: end_call
