# Decline-transfer path: the front office offers to transfer Hailey to the
# safety director. She should politely decline (she's only gathering details for
# a callback), then collect the contact info and a school-hours callback time.
name: transfer_path

judge:
  modality: text
  eval:
    service: openai
    model: gpt-4o-mini

turns:
  - user: "Maple Grove Unified School District, front desk."
    expect:
      - event: response
        eval: "says she is calling from RunScout and asks who is in charge of safety or security at the school or district"

  - user: "That's our director of safety, Dana Smith. Want me to transfer you?"
    expect:
      - event: response
        eval: "politely declines the transfer (says there's no need / she just wants to leave details for a senior rep to follow up) and asks for Dana's email and direct phone number"

  - user: "Sure, dana.smith@maplegrove.k12.ca.us, and the front office line is 555-0148 extension 12."
    expect:
      - event: response
        eval: "reads the email address back to confirm it is spelled correctly, and asks for a good time during the school day for a senior rep to call"

  - user: "Mornings are good, maybe Tuesday."
    expect:
      # Expectations match in order: Hailey saves the contact (with a
      # school-hours time), thanks them, then hangs up.
      - event: function_call
        calls:
          - name: save_contact_info
      - event: response
        eval: "thanks them"
      - event: function_call
        calls:
          - name: end_call
