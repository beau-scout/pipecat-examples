# Transfer path: the front office transfers Hailey to the district's safety
# director. Because she has now reached the security decision maker, Hailey
# explains what RunScout does and asks for a good time for a senior rep to
# follow up, captures the contact (with that time), and ends the call.
name: transfer_path

judge:
  modality: text
  eval:
    service: openai
    model: gpt-4o-mini

turns:
  - user: "Maple Grove Unified School District, front desk."
    expect:
      - event: response
        eval: "says she is calling from RunScout and asks who is in charge of safety or security at the school or district"

  - user: "That would be our director of safety. Hold on, I'll transfer you."
    expect:
      - event: response
        eval: "thanks them and waits for the transfer; does not say goodbye or end the call"

  - user: "Hi, this is Dana Smith, director of safety and security. Who am I speaking with?"
    expect:
      - event: response
        eval: "introduces herself as calling from RunScout and, since she has reached the security decision maker, explains what RunScout does (detecting incidents like student elopement or propped-open doors using existing cameras) and asks for a good time for a senior representative to speak with them"

  - user: "Sure, we could talk next Tuesday afternoon. Email me at dana.smith@maplegrove.k12.ca.us."
    expect:
      # Hailey reads the email back to confirm before saving.
      - event: response
        eval: "reads the email address back to confirm it is spelled correctly"

  - user: "That's right."
    expect:
      # Expectations match in order: Hailey saves the contact (including the
      # follow-up time), thanks Dana, then hangs up.
      - event: function_call
        calls:
          - name: save_contact_info
      - event: response
        eval: "thanks Dana"
      - event: function_call
        calls:
          - name: end_call
