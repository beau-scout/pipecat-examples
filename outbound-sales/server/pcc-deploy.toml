# Deployment config for the Pipecat CLI (`pipecat cloud deploy`).
# Note: this repo deploys via GitHub Actions (.github/workflows/deploy.yml),
# which uses a Pipecat Cloud build — no Docker registry image needed.
agent_name = "outbound-sales"
secret_set = "scout"
agent_profile = "agent-1x"

[scaling]
	min_agents = 1
